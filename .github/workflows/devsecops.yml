# To run end to end DevSecOps CI Pipeline

name: DevSecOps

on:
    push:
        branches: DevSecOps

jobs:
    ## CI
    # code stage
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    # Secret Scanning
    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml

    # Dependency Checks
    dependency-checks:
        uses: ./.github/workflows/dependency-scan.yml

    # Docker Checks
    docker-checks:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit

    # Code Tests
    code-tests:
        uses: ./.github/workflows/code-tests.yml

    # SonarQube
    sonar-qube:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit

    # push-to-docker-hub:
    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs: [code-quality,code-tests,sonar-qube,docker-checks,dependency-checks,secret-scanning]
        secrets: inherit

    ## ------cd------
    deploy:
        needs: [docker-push]
        uses: ./.github/workflows/deploy.yml
        secrets: inherit

    dast-scan:
        needs: [deploy]
        uses: ./.github/workflows/dast.yml
        secrets: inherit

    